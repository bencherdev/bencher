[package]
name = "api_mcp"
version.workspace = true
authors.workspace = true
edition.workspace = true
license-file.workspace = true
publish = false

[features]
default = []
plus = [
    "dep:api_organizations",
    "api_organizations/plus",
    "dep:api_projects",
    "api_projects/plus",
    "dep:api_run",
    "api_run/plus",
    "dep:bencher_endpoint",
    "bencher_endpoint/plus",
    "dep:bencher_json",
    "bencher_json/plus",
    "bencher_otel?/plus",
    "dep:bencher_schema",
    "bencher_schema/plus",
    "dep:bytes",
    "dep:dropshot",
    "dep:futures",
    "dep:http",
    "dep:http-body-util",
    "dep:rmcp",
    "dep:schemars",
    "dep:serde",
    "dep:serde_json",
    "dep:slog",
    "dep:strum",
]
otel = ["dep:bencher_otel"]

[dependencies]
api_organizations = { workspace = true, optional = true }
api_projects = { workspace = true, optional = true }
api_run = { workspace = true, optional = true }
bencher_endpoint = { workspace = true, optional = true }
bencher_json = { workspace = true, features = ["server", "schema"], optional = true }
bencher_otel = { workspace = true, optional = true }
bencher_schema = { workspace = true, optional = true }

bytes = { workspace = true, optional = true }
dropshot = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
http = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
rmcp = { workspace = true, optional = true, features = ["server", "transport-streamable-http-server"] }
schemars = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
slog = { workspace = true, optional = true }
strum = { workspace = true, optional = true }

[dev-dependencies]
bencher_api_tests.workspace = true
bencher_json = { workspace = true, features = ["server"] }
diesel.workspace = true
http.workspace = true
jsonschema.workspace = true
reqwest = { workspace = true, features = ["json", "rustls-no-provider"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
