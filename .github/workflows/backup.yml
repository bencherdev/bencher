name: Backup

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  MOLD_VERSION: 2.34.1

jobs:
  backup_database:
    name: Backup Database
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: rui314/setup-mold@7e4f20ad28a2e8ca6fd0892ccf72e2abb706b9c3 # v1
        with:
          mold-version: ${{ env.MOLD_VERSION }}
      - name: Install `bencher` CLI
        run: cargo install --debug --path services/cli --locked --force
      - name: Backup API Server Database
        run: |
          bencher server backup \
          --host https://api.bencher.dev \
          --token ${{ secrets.BENCHER_API_TOKEN_ADMIN }} \
          --compress \
          --data-store aws_s3 \
          --remove
