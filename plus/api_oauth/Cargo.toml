[package]
name = "api_oauth"
version.workspace = true
authors.workspace = true
edition.workspace = true
license-file.workspace = true
publish = false

[features]
default = []
plus = [
    "dep:bencher_cimd",
    "bencher_cimd/plus",
    "dep:bencher_egress",
    "bencher_egress/plus",
    "dep:bencher_endpoint",
    "bencher_endpoint/plus",
    "dep:bencher_json",
    "bencher_json/plus",
    "bencher_otel?/plus",
    "dep:bencher_schema",
    "bencher_schema/plus",
    "dep:bencher_token",
    "bencher_token/plus",
    "dep:diesel",
    "dep:dropshot",
    "dep:http",
    "dep:schemars",
    "dep:serde",
    "dep:serde_json",
    "dep:slog",
    "dep:url",
]
otel = ["dep:bencher_otel"]

[dependencies]
bencher_cimd = { workspace = true, optional = true }
bencher_egress = { workspace = true, optional = true }
bencher_endpoint = { workspace = true, optional = true }
bencher_json = { workspace = true, features = ["server", "schema", "db"], optional = true }
bencher_otel = { workspace = true, optional = true }
bencher_schema = { workspace = true, optional = true }
bencher_token = { workspace = true, optional = true }

diesel = { workspace = true, optional = true }
dropshot = { workspace = true, optional = true }
http = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
slog = { workspace = true, optional = true }
url = { workspace = true, optional = true }

[dev-dependencies]
async-trait.workspace = true
bencher_api_tests.workspace = true
bencher_egress = { workspace = true, features = ["test-loopback"] }
bencher_json = { workspace = true, features = ["server", "test-clock"] }
diesel.workspace = true
http.workspace = true
jsonwebtoken.workspace = true
reqwest = { workspace = true, features = ["json", "rustls-no-provider"] }
rustls.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
url.workspace = true

[lints]
workspace = true
