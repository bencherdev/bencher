[package]
name = "test_console"
version.workspace = true
authors.workspace = true
edition.workspace = true
license-file.workspace = true
publish = false

[features]
default = ["plus"]
# The end-to-end suite seeds a private project, which takes a license.
plus = [
    "bencher_json/plus",
    "dep:base64",
    "dep:bencher_license",
    "dep:camino",
    "dep:futures-concurrency",
    "dep:tempfile",
    "tokio/process",
    "tokio/signal",
]

[dependencies]
bencher_json = { workspace = true, features = ["client"] }
bencher_license = { workspace = true, optional = true, features = ["plus"] }
anyhow.workspace = true
base64 = { workspace = true, optional = true }
camino = { workspace = true, optional = true }
clap.workspace = true
futures-concurrency = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["json", "rustls-no-provider"] }
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile = { workspace = true, optional = true }
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[lints]
workspace = true
