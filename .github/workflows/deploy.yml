name: Deploy Devel

on:
  workflow_call:
    inputs:
      mold-version:
        type: string
        required: true
      go-version:
        type: string
        required: true
      deploy-dev:
        type: boolean
        required: true
      deploy-test:
        type: boolean
        required: true
      deploy-prod:
        type: boolean
        required: true
    secrets:
      FLY_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      CLOUDFLARE_API_TOKEN:
        required: true
      BENCHER_USER_AGENT:
        required: true

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  GITHUB_REGISTRY: ghcr.io
  API_DOCKER_IMAGE: bencher-api
  FLY_REGISTRY: registry.fly.io
  BENCHER_CONSOLE: bencher-console

jobs:
  deploy_api_fly_dev:
    name: Deploy API to Fly.io Dev
    if: ${{ inputs.deploy-dev }}
    runs-on: ubuntu-22.04
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: cli
          mold-version: ${{ inputs.mold-version }}
      - name: Install musl toolchain (for runner daemon)
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl
      - name: Enable KVM (for runner daemon)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Setup Go (for OCI conformance tests)
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ inputs.go-version }}

      - name: Log in to the Container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.GITHUB_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull & Tag API Image
        run: |
          docker pull ${{ env.GITHUB_REGISTRY }}/${{ github.repository_owner }}/${{ env.API_DOCKER_IMAGE }}:${{ github.sha }}-amd64
          docker tag ${{ env.GITHUB_REGISTRY }}/${{ github.repository_owner }}/${{ env.API_DOCKER_IMAGE }}:${{ github.sha }}-amd64 ${{ env.FLY_REGISTRY }}/bencher-api-dev
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master
      - name: Deploy Local API to Fly.io
        working-directory: ./services/api
        run: flyctl deploy --local-only --config fly/fly.dev.toml --wait-timeout 300
      - name: Run Smoke Test
        id: smoke-test
        continue-on-error: true
        env:
          RUST_BACKTRACE: full
        run: cargo test-api smoke dev
      - name: OCI Conformance Test Summary
        if: always()
        run: |
          echo "## OCI Conformance Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f ./oci-conformance-results/test-output.log ]; then
            echo "<details>" >> $GITHUB_STEP_SUMMARY
            echo "<summary>Test Output</summary>" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat ./oci-conformance-results/test-output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "</details>" >> $GITHUB_STEP_SUMMARY
          else
            echo "No test output found." >> $GITHUB_STEP_SUMMARY
          fi
      - name: Check Smoke Test Result
        if: steps.smoke-test.outcome == 'failure'
        run: exit 1

  deploy_console_cloudflare_dev:
    name: Deploy Console UI to Cloudflare Dev
    if: ${{ inputs.deploy-dev }}
    needs: deploy_api_fly_dev
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Download Console UI Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.BENCHER_CONSOLE }}
          path: ./services/console
      # `wrangler` is a dev dependency of the console. It used to arrive as part
      # of `npm run cloudflare`, which the build job now runs instead.
      - name: Install Dependencies
        working-directory: ./services/console
        run: npm ci
      - name: Verify Deploy Target
        working-directory: ./services/console
        run: npm run deploy-target dev-console
      - name: Deploy Console UI to Cloudflare Dev
        working-directory: ./services/console
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --env dev
      - uses: rui314/setup-mold@7e4f20ad28a2e8ca6fd0892ccf72e2abb706b9c3 # v1
        with:
          mold-version: ${{ inputs.mold-version }}
      - name: Run Console Dev Test
        env:
          RUST_BACKTRACE: full
          BENCHER_USER_AGENT: ${{ secrets.BENCHER_USER_AGENT }} # the secret name predates the x-bencher-agent header it now carries
        run: cargo test-console dev --agent-key "$BENCHER_USER_AGENT" devel

  deploy_api_fly_test:
    name: Deploy API to Fly.io Test
    if: ${{ inputs.deploy-test }}
    runs-on: ubuntu-22.04
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Log in to the Container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.GITHUB_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull & Tag API Image
        run: |
          docker pull ${{ env.GITHUB_REGISTRY }}/${{ github.repository_owner }}/${{ env.API_DOCKER_IMAGE }}:${{ github.sha }}-amd64
          docker tag ${{ env.GITHUB_REGISTRY }}/${{ github.repository_owner }}/${{ env.API_DOCKER_IMAGE }}:${{ github.sha }}-amd64 ${{ env.FLY_REGISTRY }}/bencher-api-test
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master
      - name: Deploy Litestream API to Fly.io Test
        working-directory: ./services/api
        run: flyctl deploy --local-only --config fly/fly.test.toml --wait-timeout 300
      - uses: rui314/setup-mold@7e4f20ad28a2e8ca6fd0892ccf72e2abb706b9c3 # v1
        with:
          mold-version: ${{ inputs.mold-version }}
      - name: Run Smoke Test
        env:
          RUST_BACKTRACE: full
        run: cargo test-api smoke test

  deploy_api_fly_prod:
    name: Deploy API to Fly.io Prod
    if: ${{ inputs.deploy-prod }}
    needs: deploy_api_fly_test
    runs-on: ubuntu-22.04
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 # zizmor: ignore[artipacked] the prod deploy rebases main onto cloud and pushes, so it needs the persisted GITHUB_TOKEN
        with:
          fetch-depth: 0
      - name: Log in to the Container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.GITHUB_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull & Tag API Image
        run: |
          docker pull ${{ env.GITHUB_REGISTRY }}/${{ github.repository_owner }}/${{ env.API_DOCKER_IMAGE }}:${{ github.sha }}-amd64
          docker tag ${{ env.GITHUB_REGISTRY }}/${{ github.repository_owner }}/${{ env.API_DOCKER_IMAGE }}:${{ github.sha }}-amd64 ${{ env.FLY_REGISTRY }}/bencher-api
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master
      - name: Deploy API to Fly.io Prod
        working-directory: ./services/api
        run: flyctl deploy --local-only --config fly/fly.toml --wait-timeout 3600
      - name: Rebase main on cloud
        run: |
          set -euo pipefail
          git config --global user.name "Bencher"
          git config --global user.email "git@bencher.dev"
          git fetch origin cloud main
          git checkout main
          git rebase origin/cloud
          git push

  deploy_console_cloudflare_prod:
    name: Deploy Console UI to Cloudflare Prod
    if: ${{ inputs.deploy-prod }}
    needs: deploy_api_fly_prod
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Download Console UI Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.BENCHER_CONSOLE }}
          path: ./services/console
      # `wrangler` is a dev dependency of the console. It used to arrive as part
      # of `npm run cloudflare`, which the build job now runs instead.
      - name: Install Dependencies
        working-directory: ./services/console
        run: npm ci
      - name: Verify Deploy Target
        working-directory: ./services/console
        run: npm run deploy-target console
      - name: Deploy Console UI to Cloudflare Prod
        working-directory: ./services/console
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --env ""
      - uses: rui314/setup-mold@7e4f20ad28a2e8ca6fd0892ccf72e2abb706b9c3 # v1
        with:
          mold-version: ${{ inputs.mold-version }}
      - name: Run Console Test
        env:
          RUST_BACKTRACE: full
          BENCHER_USER_AGENT: ${{ secrets.BENCHER_USER_AGENT }} # the secret name predates the x-bencher-agent header it now carries
        run: cargo test-console prod --agent-key "$BENCHER_USER_AGENT" cloud
