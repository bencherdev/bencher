name: "Setup Rust Environment"
description: "Set up Rust with mold linker and caching"

inputs:
  mold-version:
    description: "Mold linker version"
    required: true
  cache-key:
    description: "Cache key suffix"
    required: true
  working-directory:
    description: "Working directory for cargo commands"
    required: false
    default: "."

runs:
  using: "composite"
  steps:
    - name: Setup Rust cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ inputs.cache-key }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-cargo-${{ inputs.cache-key }}-
          ${{ runner.os }}-${{ runner.arch }}-cargo-

    - name: Setup mold linker
      uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
      with:
        mold-version: ${{ inputs.mold-version }}

    - name: Install cargo-nextest
      uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
      with:
        tool: cargo-nextest
