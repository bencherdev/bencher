name: Nix

on:
  workflow_call:
    inputs:
      nix-lint:
        type: boolean
        required: true
      nix-build:
        type: boolean
        required: true

jobs:
  nix_lints:
    name: Check Nix code
    if: ${{ inputs.nix-lint }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          nix_path: nixpkgs=channel:nixos-25.11
      - name: Check nix formatting
        run: nix develop .#ci --command alejandra --check .
      - name: Check nix lints
        run: nix develop .#ci --command statix check
      - name: Check for dead nix code
        run: nix develop .#ci --command deadnix

  build_bencher_nix:
    name: Build `bencher` Nix Package
    if: ${{ inputs.nix-build }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          nix_path: nixpkgs=channel:nixos-25.11
      - name: Nix build
        run: nix build .#bencher
