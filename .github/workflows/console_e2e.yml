name: Console E2E

on:
  workflow_call:
    inputs:
      mold-version:
        type: string
        required: true
      wasm-pack-version:
        type: string
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  console_e2e:
    name: Console E2E
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: BRAINSia/free-disk-space@7048ffbf50819342ac964ef3998a51c2564a8a75 # v2.1.3
        with:
          large-packages: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: console-e2e
          mold-version: ${{ inputs.mold-version }}
      - uses: ./.github/actions/setup-node
        with:
          working-directory: ./services/console
      - name: Install `wasm-pack`
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: wasm-pack@${{ inputs.wasm-pack-version }}
      - name: Install Playwright Chromium
        working-directory: ./services/console
        run: npx playwright install --with-deps --only-shell chromium
      - name: Run the console end-to-end suite
        run: cargo test-console e2e
      - name: Upload Playwright Traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: console-e2e-traces
          path: ./services/console/test-results
          if-no-files-found: ignore
