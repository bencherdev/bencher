[package]
name = "bencher_github_client"
version.workspace = true
authors.workspace = true
edition.workspace = true
license-file.workspace = true
publish = false

[features]
test-base-url = ["dep:rustls", "dep:tokio"]

[dependencies]
aws-lc-rs.workspace = true
bencher_valid = { workspace = true, features = ["plus", "server"] }
hex.workspace = true
jsonwebtoken.workspace = true
oauth2.workspace = true
oauth2-reqwest.workspace = true
octocrab.workspace = true
reqwest = { workspace = true, features = ["json", "rustls-no-provider"] }
rustls = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true, features = ["io-util", "net", "rt", "time"] }
url.workspace = true

[dev-dependencies]
base64.workspace = true
bencher_valid = { workspace = true, features = ["test-clock"] }
rustls.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "time"] }

[lints]
workspace = true
