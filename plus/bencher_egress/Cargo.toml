[package]
name = "bencher_egress"
version.workspace = true
authors.workspace = true
edition.workspace = true
license-file.workspace = true
publish = false

[features]
default = []
# Required due to feature unification
# https://doc.rust-lang.org/cargo/reference/features.html#feature-unification
plus = [
    "dep:async-trait",
    "dep:derive_more",
    "dep:http",
    "dep:reqwest",
    "dep:thiserror",
    "dep:tokio",
    "dep:url",
]
# Lets tests reach a listener on loopback. Only `[dev-dependencies]` may enable it.
test-loopback = ["plus"]

[dependencies]
async-trait = { workspace = true, optional = true }
derive_more = { workspace = true, optional = true }
http = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true, features = ["rustls-no-provider"] }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["net"] }
url = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "net", "test-util"] }
tokio-rustls.workspace = true

[lints]
workspace = true
