[package]
name = "bencher_cimd"
version.workspace = true
authors.workspace = true
edition.workspace = true
license-file.workspace = true
publish = false

[features]
default = []
# Required due to feature unification
# https://doc.rust-lang.org/cargo/reference/features.html#feature-unification
plus = [
    "dep:bencher_egress",
    "bencher_egress/plus",
    "dep:bencher_json",
    "bencher_json/plus",
    "dep:thiserror",
    "dep:tokio",
    "dep:url",
]

[dependencies]
bencher_egress = { workspace = true, optional = true }
bencher_json = { workspace = true, optional = true, features = ["server"] }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["sync"] }
url = { workspace = true, optional = true }

[dev-dependencies]
async-trait.workspace = true
bencher_egress = { workspace = true, features = ["test-loopback"] }
bencher_json = { workspace = true, features = ["server", "test-clock"] }
futures.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls.workspace = true

[lints]
workspace = true
